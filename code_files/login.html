<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
      <div class="universal-head">
        
          <img src="../pics/fosol-logo.png" alt="" class="khamarika_logo" />
          <h1>খামারীকা</h1>
        
      </div>
    </header>
    
    <div class="login_page">
        <div class="left">
       
          <img src="../pics/hompage_krishok.png" alt="" class="krishok-photo"/>
        
        <div class="left-bottom">
          <h1>
            কৃষির প্রতিটি ধাপে,<br />
            আপনার বিশ্বস্ত সাথী।
          </h1>
          <p>
            একটি অ্যাকাউন্টেই আপনার খামার, ফসল, বিশেষজ্ঞের সহায়তা ও নিজের বাজার।
          </p>
          <p class="features">
            ✓ সহজ ব্যবস্থাপনা<br />
            ✓ সঠিক সময়ে বিশেষজ্ঞের যোগাযোগ <br />
            ✓ সরাসরি কৃষক–ক্রেতার সংযোগ
          </p>
        </div>
      </div>

      <div class="right">
        <div class="right-top">
            <h1>লগইন তথ্য যাচাই করুন</h1>
        </div>
        <form action="" class="login_form">
            <label for="phone">মোবাইল নম্বর</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="০১XXXXXXXXX"
                required
              />

              <label for="password">পাসওয়ার্ড</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="কমপক্ষে ৮ অক্ষর"
              minlength="8"
              required
            />
            <div class="form-check">
            <input type="checkbox" id="terms" name="terms" required />
            <label for="terms"
              >আমি ব্যবহারের শর্ত ও গোপনীয়তা নীতিতে সম্মত।</label
            >
          </div>




             <button type="submit" class="login-btn">
            অ্যাকাউন্ট তৈরি করুন →
          </button>
        </form>
         <footer>
        <p>একাউন্ট নেই?</p>
        <a href="sign_up.html"><p>একাউন্ট খুলুন</p></a>
    </footer>
      </div>
    </div>
   
</body>
</html>
